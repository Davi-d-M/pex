<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5dc; /* beige */
    }

    .bg-orange {
      background-color: #ff8c00 !important;
    }

    .navbar .nav-link,
    .navbar-brand,
    .navbar h4 {
      color: #fff !important;
    }

    .card {
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- 🔶 NAVBAR -->
<div class="container-fluid nav-bar p-0">
  <div class="row gx-0 bg-orange px-5 align-items-center">
    
    <div class="col-12">
      <nav class="navbar navbar-expand-lg navbar-light bg-orange">
        
        <a href="index.html" class="navbar-brand">
          <h4 class="m-0 text-white">APEX-MARKET</h4>
        </a>

        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarCollapse">
          <span class="fa fa-bars"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">
          <div class="navbar-nav ms-auto">
            <a href="index.html" class="nav-link">Home</a>
            <a href="checkout.html" class="nav-link">Cart</a>
            <a href="contact.html" class="nav-link">Contact</a>
          </div>
        </div>

      </nav>
    </div>

  </div>
</div>

<!-- 🛒 CART -->
<div class="container py-5">
  <h2 class="mb-4">🛒 Your Cart</h2>

  <!-- ITEMS -->
  <div id="cart-container" class="mb-4"></div>

  <!-- TOTAL -->
  <div class="card p-3 shadow-sm">
    <h4>Total: <span id="cart-total">0</span></h4>
  </div>

  <!-- ACTION -->
  <button class="btn btn-success mt-3" onclick="sendToWhatsApp()">
    Order via WhatsApp
  </button>
</div>

<!-- CART LOGIC -->
<script>
  document.addEventListener("DOMContentLoaded", renderCartUI);

  function getCart() {
    try {
      return JSON.parse(localStorage.getItem("electro_cart")) || [];
    } catch {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem("electro_cart", JSON.stringify(cart));
  }

  function renderCartUI() {
    const container = document.getElementById("cart-container");
    const totalEl = document.getElementById("cart-total");

    const cart = getCart();

    if (cart.length === 0) {
      container.innerHTML = "<p>Your cart is empty</p>";
      totalEl.textContent = "0";
      return;
    }

    let html = "";
    let total = 0;

    cart.forEach(item => {
      const itemTotal = item.price * item.qty;
      total += itemTotal;

      // 🔥 Fix image path (handles spaces)
      const safeImage = item.image.replace(/ /g, "%20");

      html += `
        <div class="card mb-3 shadow-sm p-3">
          <div class="row align-items-center">

            <div class="col-md-2">
              <img src="${safeImage}" class="img-fluid rounded">
            </div>

            <div class="col-md-4">
              <h6>${item.name}</h6>
              <small>Price: ${item.price}</small>
            </div>

            <div class="col-md-3 d-flex align-items-center gap-2">
              <button class="btn btn-sm btn-outline-secondary" onclick="changeQty('${item.id}', -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn btn-sm btn-outline-secondary" onclick="changeQty('${item.id}', 1)">+</button>
            </div>

            <div class="col-md-2 text-end">
              <strong>${itemTotal}</strong>
            </div>

            <div class="col-md-1 text-end">
              <button class="btn btn-sm btn-danger" onclick="removeItem('${item.id}')">x</button>
            </div>

          </div>
        </div>
      `;
    });

    container.innerHTML = html;
    totalEl.textContent = total;
  }

  function changeQty(id, delta) {
    const cart = getCart();
    const item = cart.find(i => i.id === id);
    if (!item) return;

    item.qty += delta;

    if (item.qty <= 0) {
      removeItem(id);
      return;
    }

    saveCart(cart);
    renderCartUI();
  }

  function removeItem(id) {
    let cart = getCart();
    cart = cart.filter(item => item.id !== id);

    saveCart(cart);
    renderCartUI();
  }

  // 📲 WhatsApp integration
  function sendToWhatsApp() {
    const cart = getCart();

    if (cart.length === 0) {
      alert("Cart is empty");
      return;
    }

    let message = "Hello, I want to order:\n\n";

    cart.forEach(item => {
      const safeImage = item.image.replace(/ /g, "%20");

      message += `🛒 ${item.name}\n`;
      message += `Qty: ${item.qty}\n`;
      message += `Price: ${item.price}\n`;
      message += `Image: ${window.location.origin}/${safeImage}\n\n`;
    });

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    message += `Total: ${total}`;

    const phone = "254712646907"; // your number

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
  }
</script>

</body>
</html>
